[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swapo"
version = "0.1.0"
description = "Semantic, workload- and provenance-aware physical design for genomic tables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["genomics", "lakehouse", "parquet", "query optimization", "provenance"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "duckdb>=0.10",
  "pyarrow>=14",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
swapo = "swapo.cli:main"

[tool.setuptools.packages.find]
include = ["swapo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
